<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TravelOS v5.1</title>
    <style>
        :root { --bg: #06090f; --surface: #0d1117; --accent: #10b981; --text: #e2e8f0; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; }
        
        /* HEADER */
        .header { background: #111; padding: 15px; text-align: center; border-bottom: 1px solid #333; font-weight: bold; color: var(--accent); }

        /* MENU TABS */
        .tabs { display: flex; background: #1a1a1a; padding: 5px; gap: 5px; }
        .tab-btn { flex: 1; padding: 15px; border: none; border-radius: 8px; background: #222; color: #888; font-weight: bold; font-size: 12px; cursor: pointer; }
        .tab-btn.active { background: var(--accent); color: black; }

        /* SCREENS */
        .screen { flex: 1; display: none; overflow-y: auto; padding: 20px; }
        .screen.active { display: block; }

        /* CHAT MSG */
        .msgs { display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 12px; border-radius: 15px; font-size: 14px; max-width: 85%; line-height: 1.4; }
        .agent { background: #1e293b; align-self: flex-start; }
        .client { background: #3b82f6; align-self: flex-end; }
        
        /* CARDS */
        .card { background: var(--surface); padding: 15px; border-radius: 12px; margin-bottom: 10px; border: 1px solid #222; }
        .big-num { font-size: 24px; font-weight: bold; color: var(--accent); }
        .lbl { font-size: 10px; color: #666; text-transform: uppercase; }

        /* INPUT ROW */
        .input-row { padding: 15px; background: #111; display: flex; gap: 10px; border-top: 1px solid #333; }
        input { flex: 1; padding: 12px; border-radius: 20px; border: 1px solid #444; background: #222; color: white; outline: none; font-size: 16px; }
        button#send-btn { background: var(--accent); border: none; padding: 10px 20px; border-radius: 20px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">TRAVELOS PRO 5.1</div>

    <div class="tabs">
        <button class="tab-btn active" id="btn-chat" onclick="changeTab('chat')">💬 Чат</button>
        <button class="tab-btn" id="btn-mkt" onclick="changeTab('mkt')">📊 Маркетинг</button>
        <button class="tab-btn" id="btn-shield" onclick="changeTab('shield')">🛡️ Shield</button>
    </div>

    <!-- ЧАТ -->
    <div id="chat" class="screen active">
        <div class="msgs" id="chat-win">
            <div class="msg agent">Здравейте! Напишете <b>"Тунис"</b>, за да видите офертата.</div>
        </div>
    </div>

    <!-- МАРКЕТИНГ -->
    <div id="mkt" class="screen">
        <div class="card"><span class="lbl">Ad Spend</span><br><span class="big-num">€842.00</span></div>
        <div class="card"><span class="lbl">ROAS</span><br><span class="big-num">8.4x</span></div>
        <div class="card" style="font-size:12px">
            <b>Live Leads:</b><br>
            • Иван Петров - Тунис (преди 2 мин)<br>
            • Мария Г. - Гърция (преди 10 мин)
        </div>
    </div>

    <!-- SHIELD -->
    <div id="shield" class="screen">
        <div class="card"><span class="lbl">Защитени приходи</span><br><span class="big-num">€1.24M</span></div>
        <div class="card">🛡️ <b>Financial Shield:</b> Активен ✓</div>
    </div>

    <!-- INPUT -->
    <div class="input-row" id="inp-area">
        <input type="text" id="user-msg" placeholder="Напиши Тунис...">
        <button id="send-btn" onclick="sendMsg()">➤</button>
    </div>

    <script>
        // ФУНКЦИЯ ЗА СМЯНА НА ТАБОВЕ
        function changeTab(tabName) {
            // 1. Скрий всички екрани
            document.getElementById('chat').style.display = 'none';
            document.getElementById('mkt').style.display = 'none';
            document.getElementById('shield').style.display = 'none';
            
            // 2. Покажи избрания
            document.getElementById(tabName).style.display = 'block';

            // 3. Оцвети бутоните
            document.getElementById('btn-chat').className = 'tab-btn';
            document.getElementById('btn-mkt').className = 'tab-btn';
            document.getElementById('btn-shield').className = 'tab-btn';
            document.getElementById('btn-' + tabName).className = 'tab-btn active';

            // 4. Скрий полето за писане, ако не е чат
            document.getElementById('inp-area').style.display = (tabName === 'chat') ? 'flex' : 'none';
        }

        // ФУНКЦИЯ ЗА ИЗПРАЩАНЕ
        function sendMsg() {
            var inp = document.getElementById('user-msg');
            var win = document.getElementById('chat-win');
            var val = inp.value.trim();
            if(!val) return;

            // Съобщение клиент
            var cDiv = document.createElement('div');
            cDiv.className = 'msg client';
            cDiv.innerText = val;
            win.appendChild(cDiv);
            inp.value = "";

            // Отговор AI
            setTimeout(function() {
                var aDiv = document.createElement('div');
                aDiv.className = 'msg agent';
                var low = val.toLowerCase();
                
                if(low.includes("тунис")) {
                    aDiv.innerHTML = "🌴 Оферта за Тунис!<br>🏨 <b>Iberostar Averroes</b><br>💰 Цена: <b>€640</b>";
                } else if(low.includes("гърция")) {
                    aDiv.innerHTML = "🏖️ Оферта за Гърция!<br>🏨 <b>Sani Beach</b><br>💰 Цена: <b>€550</b>";
                } else {
                    aDiv.innerText = "Моля, напишете 'Тунис' или 'Гърция'.";
                }
                win.appendChild(aDiv);
                // Скрол до долу
                var chatScreen = document.getElementById('chat');
                chatScreen.scrollTop = chatScreen.scrollHeight;
            }, 800);
        }
    </script>
</body>
</html>
